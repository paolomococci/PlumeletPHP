        stroke-linecap="round" />
      <!-- Red feather animations. -->
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-90,-160" dur="5s" fill="freeze"
        additive="sum" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 30,0; 0,0; -30,0; 0,0" dur="7s"
        begin="0s" fill="freeze" additive="sum" />
      <animateTransform attributeName="transform" type="rotate"
        values="0 200 300; 15 -300 315; 0 600 315; -15 200 315; 0 -300 315" dur="8s" begin="0s" fill="freeze"
