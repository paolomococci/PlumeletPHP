        <path d="M145,125 Q 155,135 165,145" fill="none" />
        <path d="M135,175 Q 145,185 155,195" fill="none" />
        <path d="M75,235 Q 65,245 55,255" fill="none" />
      </g>
      <!-- To stylize the rachis and the calamus of the feather. -->
      <path d="M100,270 C 95,200 105,100 100,45" fill="none" stroke="url(#centralRachisGrad)" stroke-width="2.2"
        stroke-linecap="round" />
      <!-- White feather animations. -->
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-40,220" dur="5s" fill="freeze"
        additive="sum" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 40,0; 0,0; -40,0; 0,0" dur="6s"
        begin="0s" fill="freeze" additive="sum" />
      <animateTransform attributeName="transform" type="rotate"
        values="0 200 315; 10 -200 315; 0 600 315; -10 -200 315; 0 200 315" dur="5s" begin="0s" fill="freeze"
        additive="sum" />
    </g>

    <!-- A red feather, positioned on the right.  -->
    <g id="redFeather" filter="url(#feather)" transform="rotate(170 350 250)">
      <path d="M100,40 C 60,80 30,150 40,220 C 50,270 100,270 100,270 C 100,270 150,270 150,220 C 170,150 140,80 100,40"
