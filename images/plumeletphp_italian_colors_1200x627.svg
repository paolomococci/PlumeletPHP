<svg width="1200" height="627" viewBox="0 0 1200 627" xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="xMidYMid meet" role="img" aria-label="Three feathers colored like the Italian flag.">
  <title>PlumeletPHP - A full-stack PHP framework with the colors of the Italian flag</title>
  <defs>
    <!-- Opaque gradient filter. -->
    <filter id="feather" x="-.020" y="-.016" width="1.045" height="1.036">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" />
    </filter>
    <!-- Filter to soften the whole and make it evanescent. -->
    <filter id="featherBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" />
    </filter>
    <!-- Gradient for the right spine. -->
    <linearGradient id="leftRachisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#084; stop-opacity:1" />
      <stop offset="50%" style="stop-color:#088; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#084; stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for the central spine. -->
    <linearGradient id="centralRachisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff; stop-opacity:1" />
      <stop offset="50%" style="stop-color:#aaa; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff; stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for the right spine. -->
    <linearGradient id="rightRachisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c22; stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c26; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c22; stop-opacity:1" />
    </linearGradient>
    <!-- Gaussian Blur Filter. -->
    <!-- I define a gradient that progresses from white at the center to black at the boundary, incorporating intermediate gray tones. -->
    <radialGradient id="softEdgeGradient">
      <!-- The color is white for the first 35% of the radius. -->
      <stop offset="35%" stop-color="#fff" />
      <!-- It blends to a gray tone, extending out to 85% of the radius. -->
      <stop offset="85%" stop-color="#999" />
      <!-- It ends with absolute black at 100% of the radius. -->
      <stop offset="100%" stop-color="#000" />
    </radialGradient>
    <mask id="circularMask">
      <!-- I'll use the gradient previously defined as the fill for the circle, where I will place the feathers of my three-color design. -->
      <circle fill="url(#softEdgeGradient)" cx="600" cy="313.5" r="300" />
    </mask>
  </defs>
  <!--  -->
  <g id="featherCluster" transform="translate(0, 0)">
    <!--  Soft blue background. -->
    <path fill="#46d" d="M0 0h1200v627H0z" mask="url(#circularMask)" />
    <!-- The declaration of the levels follows, one for each feather. -->
    <!-- A green feather, positioned on the left. -->
    <g id="greenFeather" filter="url(#feather)" transform="rotate(290 190 105)">
      <path d="M100,60 C 60,80 30,150 40,220 C 50,270 100,270 100,270 C 100,270 150,270 160,220 C 170,150 140,80 100,40"
        fill="#084" fill-opacity="0.45" />
      <!-- To create a stylized slit. -->
      <path d="M100,90 Q 60,100 40,170" fill="#46d" fill-opacity="0.3" filter="url(#featherBlur)" />
      <!-- The left vane. -->
      <g stroke="#084" stroke-width="0.65" opacity="0.8" filter="url(#featherBlur)">
        <!-- Outline lines. -->
        <path d="M100,50 Q 66,61 55,81" fill="none" />
        <path d="M100,60 Q 68,75 55,110" fill="none" />
        <path d="M100,70 Q 65,80 55,125" fill="none" />
        <path d="M100,80 Q 62,95 45,145" fill="none" />
        <path d="M100,90 Q 60,100 40,170" fill="none" />
        <path d="M100,100 Q 58,110 45,205" fill="none" />
        <path d="M100,110 Q 60,125 45,225" fill="none" />
        <path d="M100,120 Q 65,130 55,245" fill="none" />
        <path d="M100,130 Q 70,140 75,255" fill="none" />
        <path d="M100,140 Q 80,155 85,265" fill="none" />
        <!-- Subtle lines used to increase density. -->
        <path d="M100,55 Q 75,65 65,95" fill="none" />
        <path d="M100,65 Q 72,75 55,115" fill="none" />
        <path d="M100,75 Q 68,85 55,135" fill="none" />
        <path d="M100,85 Q 65,95 55,165" fill="none" />
        <path d="M100,95 Q 65,105 45,195" fill="none" />
        <path d="M100,105 Q 60,115 45,215" fill="none" />
        <path d="M100,115 Q 65,125 55,235" fill="none" />
        <path d="M100,125 Q 70,135 65,235" fill="none" />
      </g>
      <!-- The right vane. -->
      <g stroke="#084" stroke-width="0.6" opacity="0.8" filter="url(#featherBlur)">
        <!-- Outline lines. -->
        <path d="M100,50 Q 120,60 135,85" fill="none" />
        <path d="M100,60 Q 125,75 135,105" fill="none" />
        <path d="M105,75 Q 135,85 145,125" fill="none" />
        <path d="M100,80 Q 135,95 145,145" fill="none" />
        <path d="M105,95 Q 135,105 145,175" fill="none" />
        <path d="M105,105 Q 135,115 135,205" fill="none" />
        <path d="M105,115 Q 135,125 125,225" fill="none" />
        <path d="M105,125 Q 125,135 115,245" fill="none" />
        <path d="M105,135 Q 125,145 115,255" fill="none" />
        <!-- Subtle lines used to increase density. -->
        <path d="M95,50 Q 120,60 130,85" fill="none" />
        <path d="M95,65 Q 125,75 135,105" fill="none" />
        <path d="M100,75 Q 135,85 145,135" fill="none" />
        <path d="M100,85 Q 135,95 135,165" fill="none" />
        <path d="M100,95 Q 132,105 125,195" fill="none" />
      </g>
      <!-- Delicate barbules, almost invisible, added for a more realistic effect. -->
      <g stroke="#084" stroke-width="0.5" opacity="0.5">
        <path d="M55,95 Q 45,105 35,115" fill="none" />
        <path d="M45,140 Q 35,155 25,165" fill="none" />
        <path d="M145,125 Q 155,135 165,145" fill="none" />
        <path d="M135,175 Q 145,185 155,195" fill="none" />
        <path d="M75,235 Q 65,245 55,255" fill="none" />
      </g>
      <!-- To stylize the rachis and the calamus of the feather. -->
      <path d="M100,270 C 95,200 105,100 100,38" fill="none" stroke="url(#leftRachisGrad)" stroke-width="2.2"
        stroke-linecap="round" />
      <!-- Green feather animations. -->
      <animateTransform attributeName="transform" type="translate" from="-200,215" to="-120,215" dur="5s" fill="freeze"
        additive="sum" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 40,0; 0,0; -40,0; 0,0" dur="7s"
        begin="0s" fill="freeze" additive="sum" />
      <animateTransform attributeName="transform" type="rotate"
        values="-90 600 215; 15 600 315; 0 600 315; -25 600 315; 0 600 315" dur="7s" begin="0s" fill="freeze"
        additive="sum" />
    </g>

